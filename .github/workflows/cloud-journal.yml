name: Cloud journal checks

on:
  push:
    paths:
      - 'cloud-journal/**'
      - '.github/workflows/cloud-journal.yml'
      - 'render.yaml'
  pull_request:
    paths:
      - 'cloud-journal/**'
      - '.github/workflows/cloud-journal.yml'
      - 'render.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-journal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cloud-journal

jobs:
  frontend:
    name: Browser client checks
    runs-on: ubuntu-24.04
    container: node:22-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check src/CraneJournal.Web/wwwroot/app.mjs
          node --check src/CraneJournal.Web/wwwroot/ui.mjs
      - name: Run client checks
        run: node --test checks/ui.test.mjs

  server:
    name: ASP.NET Core and PostgreSQL checks
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crane_journal_checks
          POSTGRES_USER: checks
          POSTGRES_PASSWORD: ci-checks-only
        options: >-
          --health-cmd "pg_isready -U checks -d crane_journal_checks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CHECK_DATABASE_URL: 'Host=postgres;Database=crane_journal_checks;Username=checks;Password=ci-checks-only;SSL Mode=Disable'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run domain, database, and HTTP checks
        run: dotnet run --project checks/CraneJournal.Checks.csproj -c Release -- --integration

  docker:
    name: Render Docker image build
    needs: [frontend, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the image used by Render
        run: docker build --tag crane-journal:check .
