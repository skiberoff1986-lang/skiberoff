  server:
    name: ASP.NET Core and PostgreSQL checks
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crane_journal_checks
          POSTGRES_USER: checks
          POSTGRES_PASSWORD: ci-checks-only
        options: >-
          --health-cmd "pg_isready -U checks -d crane_journal_checks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CHECK_DATABASE_URL: 'Host=postgres;Database=crane_journal_checks;Username=checks;Password=ci-checks-only;SSL Mode=Disable'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for PostgreSQL and ensure database exists
        run: |
          until PGPASSWORD=ci-checks-only psql -h postgres -U checks -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'crane_journal_checks';" | grep -q 1; do
            echo "Waiting for PostgreSQL database crane_journal_checks..."
            sleep 1
          done

      - name: Build and run domain, database, and HTTP checks
        run: dotnet run --project checks/CraneJournal.Checks.csproj -c Release -- --integration
